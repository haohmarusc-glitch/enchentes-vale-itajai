  <body>
    <div id="root"></div>

    <!-- VLibras - tradutor de Português para LIBRAS (acessibilidade em todas as páginas) -->
    <div vw class="enabled">
      <div vw-access-button class="active"></div>
      <div vw-plugin-wrapper>
        <div class="vw-plugin-top-wrapper"></div>
      </div>
    </div>
    <!-- `defer` de propósito: sem ele esta tag BLOQUEIA o parser no meio do
         <body>, e o React (que é um módulo, portanto adiado) só monta depois
         que vlibras.gov.br responder ou estourar o tempo. Num aplicativo recém
         instalado não há cache nenhum, e numa rede saturada de dia de cheia
         isso é a tela branca durando segundos — no site que a pessoa abriu
         justamente para ver o rio. Com `defer` o script continua executando
         antes do `window.onload` abaixo, então o widget não muda em nada. -->
    <script defer src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script>
      window.onload = function () {
        if (window.VLibras) {
          new window.VLibras.Widget('https://vlibras.gov.br/app');
        }
      };
    </script>
  </body>
</html>
