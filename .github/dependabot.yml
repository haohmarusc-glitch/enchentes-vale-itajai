# Mantém as GitHub Actions e as dependências atualizadas — e, com elas, os avisos
# de vulnerabilidade. O review de segurança apontou a falta disto e o fato de as
# actions estarem presas só ao major (@v4), sem SHA. O Dependabot abre PR quando
# sai versão nova (ou correção de segurança), que é onde se decide o pin por SHA.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "pip"
    directory: "/scripts"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    groups:
      # react e react-dom (e seus @types) saem de versões majors sincronizadas
      # upstream — separados, cada PR fica com peer dependency quebrada contra
      # o outro (visto em 01-04/09/2026: react bumpou para 19 sozinho, e
      # @types/react-dom ficou preso em ^18, derrubando `npm ci`).
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      # @vitejs/plugin-react trava a versão do vite via peer dependency
      # (visto no mesmo incidente: plugin-react@6 exige vite@^8, e vite
      # sozinho ainda estava em ^7 — ERESOLVE no `npm ci`).
      vite:
        patterns:
          - "vite"
          - "@vitejs/plugin-react"
