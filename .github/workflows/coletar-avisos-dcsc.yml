# Lê os avisos e alertas da Defesa Civil de SC (wp-json, categorias 7 Alerta e 6 Aviso) a partir do GitHub Actions,
# de 30 em 30 min.
#
# POR QUE EXISTE (08/11/2026). Da VPS (Hetzner, Helsinque) o site www.defesacivil.sc.gov.br nem aceita a conexão
# (ConnectTimeoutError em 50 s, 07/11/2026, durante a cheia); o runner do GitHub alcança (sondagem de 04/11, 200 com
# JSON). Mesmo caminho de Gaspar e do Centro de Ituporanga. A lógica e os testes ficam em
# scripts/avisos_dcsc_actions.py e scripts/teste_avisos_dcsc_actions.py.
#
# O QUE FAZ. robots.txt antes; um pedido ao wp-json com o User-Agent do projeto e timeout; converte com a MESMA
# função da VPS (coleta_avisos_dcsc.converter) e, se os avisos mudaram ou a publicação tem mais de 2 h, publica
# avisos-dcsc.json + a resposta crua no branch `coleta-avisos-dcsc` (órfão, um commit só). A VPS tenta o site
# primeiro e, recusada, lê este arquivo pelo raw.githubusercontent.com (`coleta_avisos_dcsc.py --publicar`) e
# publica `ultimo_avisos_dcsc.json` no `tempo-real`, com `via.coletor = "github-actions"`.
#
# ALERTA. Falha (robots recusando, timeout, HTTP, resposta sem avisos) deixa o job VERMELHO, guarda o diagnóstico
# como artefato e abre — ou atualiza, sem notificar de novo — a issue "Avisos da Defesa Civil de SC pelo Actions
# falhando". Quando a coleta volta, a issue é fechada com um comentário.
#
# LIMITES DO AGENDAMENTO. O GitHub pode atrasar ou pular execuções agendadas, e o agendamento só vale no main.
# No push que altera este arquivo ou o script, roda no branch do push (prova no PR).
name: Coletar avisos da Defesa Civil de SC

on:
  schedule:
    # Minutos 23 e 53: fora do :00 e dos minutos de Gaspar (7/22/37/52) e de Ituporanga (11/41).
    - cron: '23,53 * * * *'
  workflow_dispatch:
  # No push que altera este arquivo ou o script (como os workflows dos vãos): é o que prova, no PR, que o runner
  # alcança o site — o `workflow_dispatch` só funciona depois que o arquivo existe no main.
  push:
    paths:
      - .github/workflows/coletar-avisos-dcsc.yml
      - scripts/avisos_dcsc_actions.py
      - scripts/coleta_avisos_dcsc.py

permissions:
  contents: write   # publicar no branch coleta-avisos-dcsc
  issues: write     # abrir, atualizar e fechar o aviso de falha

concurrency:
  group: coletar-avisos-dcsc
  cancel-in-progress: false

jobs:
  coletar:
    name: Avisos da Defesa Civil de SC
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TITULO_ISSUE: Avisos da Defesa Civil de SC pelo Actions falhando
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Instalar dependências
        run: python3 -m pip install -r scripts/requirements.txt

      - name: Ler a publicação anterior
        run: |
          mkdir -p anterior
          if git fetch --depth=1 origin coleta-avisos-dcsc 2>/dev/null; then
            git show FETCH_HEAD:avisos-dcsc.json > anterior/avisos-dcsc.json 2>/dev/null \
              || rm -f anterior/avisos-dcsc.json
          fi

      - name: Coletar
        id: coleta
        working-directory: scripts
        run: python3 avisos_dcsc_actions.py --anterior ../anterior/avisos-dcsc.json --saida ../saida

      - name: Publicar no branch coleta-avisos-dcsc
        if: steps.coleta.outputs.mudou == 'true'
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          MOTIVO: ${{ steps.coleta.outputs.motivo }}
        run: |
          set -euo pipefail
          json=$(git hash-object -w saida/avisos-dcsc.json)
          bruto=$(git hash-object -w saida/avisos-dcsc-wp-json.json)
          arvore=$(printf '100644 blob %s\tavisos-dcsc.json\n100644 blob %s\tavisos-dcsc-wp-json.json\n' \
            "$json" "$bruto" | git mktree)
          commit=$(git commit-tree "$arvore" -m "Avisos da Defesa Civil de SC: $MOTIVO")
          git push --force --quiet origin "$commit:refs/heads/coleta-avisos-dcsc"
          echo "publicado em coleta-avisos-dcsc: $MOTIVO"

      - name: Guardar o diagnóstico da falha
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: avisos-dcsc-falha-${{ github.run_id }}
          path: saida/
          retention-days: 7
          if-no-files-found: ignore

      - name: Abrir ou atualizar a issue de falha
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ESTADO: ${{ steps.coleta.outputs.estado }}
          MOTIVO: ${{ steps.coleta.outputs.motivo }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          {
            echo "A leitura dos avisos da Defesa Civil de SC pelo GitHub Actions falhou. Última falha: **$(date -u +%Y-%m-%dT%H:%MZ)** (UTC)."
            echo
            echo "- estado: \`${ESTADO:-passo do fluxo}\`"
            echo "- motivo: ${MOTIVO:-ver o log do run}"
            echo "- run: ${RUN}"
            echo
            echo "Sem esta coleta, a VPS (que o site da Defesa Civil de SC não aceita) fica sem avisos, e o painel de avisos some. O nível ao vivo não depende dela. Lógica em \`scripts/avisos_dcsc_actions.py\`."
            echo
            echo "Esta issue é atualizada a cada falha (sem nova notificação) e fecha sozinha quando a coleta voltar."
          } > "$RUNNER_TEMP/issue-avisos-dcsc.md"
          numero=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 50 \
            --json number,title --jq ".[] | select(.title == env.TITULO_ISSUE) | .number" | head -1)
          if [ -z "$numero" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITULO_ISSUE" --body-file "$RUNNER_TEMP/issue-avisos-dcsc.md"
          else
            gh issue edit "$numero" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/issue-avisos-dcsc.md"
          fi

      - name: Fechar a issue de falha, se a coleta voltou
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          MOTIVO: ${{ steps.coleta.outputs.motivo }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          numero=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 50 \
            --json number,title --jq ".[] | select(.title == env.TITULO_ISSUE) | .number" | head -1)
          if [ -n "$numero" ]; then
            gh issue close "$numero" --repo "$GITHUB_REPOSITORY" \
              --comment "A coleta voltou em $(date -u +%Y-%m-%dT%H:%MZ) (UTC): ${MOTIVO}. Run: ${RUN}"
          fi
