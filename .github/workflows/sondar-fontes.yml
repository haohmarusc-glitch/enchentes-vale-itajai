# Sonda, pelo runner do GitHub, as fontes que a varredura de 04/11/2026 deixou "não conferidas daqui"
# (docs/VARREDURA-FONTES-2026-11-04.md) e baixa do geoportal do SGB a suscetibilidade a inundação e a
# setorização de risco das cidades da bacia.
#
# POR QUE NO ACTIONS. O serviço de camadas do CEMADEN recusa a conexão do ambiente das sessões de código e da
# rede do Jefferson; o geoportal do SGB e o WordPress da Defesa Civil de SC só abriram no navegador. O runner é
# um terceiro ponto de vista. Tudo é GET, com o User-Agent do projeto, depois do robots.txt de cada host.
#
# O QUE PUBLICA. O relatório da sondagem, o resumo do SGB e os GeoJSON no branch `sondagem-fontes` (um commit
# só, substituído a cada rodada, como `vao-oeste`). Não empurra para o main nem para branch de PR; nada daqui
# entra em data/ sem a sessão ler, conferir e o Jefferson decidir. Suscetibilidade é contexto, nunca cota.
#
# QUANDO RODA. Manualmente, ou no push que altera este arquivo ou os dois scripts.
name: Sondar fontes e baixar SGB

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/sondar-fontes.yml
      - scripts/sondar_fontes.py
      - scripts/baixar_sgb_suscetibilidade.py

permissions:
  contents: write   # publicar no branch sondagem-fontes

jobs:
  sondar:
    name: Sondagem e SGB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Instalar dependências
        run: python3 -m pip install -r scripts/requirements.txt
      - name: Sondar as fontes
        run: |
          set +e
          python3 scripts/sondar_fontes.py --relatorio sondagem.json > sondagem.txt 2>&1
          cat sondagem.txt
      - name: Baixar suscetibilidade e risco do SGB
        run: |
          set +e
          python3 scripts/baixar_sgb_suscetibilidade.py --saida sgb --relatorio sgb-resumo.json > sgb.txt 2>&1
          cat sgb.txt
      - name: Publicar no branch sondagem-fontes
        if: always()
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          linhas=""
          for f in sondagem.txt sondagem.json sgb.txt sgb-resumo.json sgb/*.geojson; do
            if [ -f "$f" ]; then
              linhas="$linhas$(printf '100644 blob %s\t%s' "$(git hash-object -w "$f")" "$(basename "$f")")"$'\n'
            fi
          done
          [ -n "$linhas" ] || { echo "nada a publicar"; exit 0; }
          arvore=$(printf '%s' "$linhas" | git mktree)
          commit=$(git commit-tree "$arvore" -m "Sondagem de fontes e SGB, a partir de ${GITHUB_SHA::7}")
          git push --force --quiet origin "$commit:refs/heads/sondagem-fontes"
          echo "publicado em sondagem-fontes: $commit"
