# Publica o site no GitHub Pages a cada mudança no main.
#
# O build é estático e o roteamento usa HashRouter, então não é preciso
# reescrita de rotas no servidor — o Pages serve os arquivos e pronto.
#
# As publicações de tempo real NÃO passam por aqui: elas vão para o branch
# `tempo-real`, que este fluxo ignora de propósito. Se cada coleta de 15
# minutos disparasse um build, o site viveria em reconstrução e o nível ao vivo
# ainda assim só apareceria depois do deploy. A página busca aquele branch em
# tempo de execução justamente para não depender disto.
name: Publicar site

# SÓ MANUAL, desde 06/09/2026. Antes era `push: branches: [main]`.
#
# POR QUÊ: o site saiu do ar de propósito. O GitHub Pages não sabe pedir login
# (Pages privado só existe no GitHub Enterprise), então o endereço público foi
# despublicado e o site passou a ser servido pelo Cloudflare Pages em
# `enchentes.premercadosc.com`, atrás do Cloudflare Access — que exige e-mail
# autorizado antes de entregar a página.
#
# Se este fluxo continuasse disparando a cada merge, ele RE-PUBLICARIA o
# endereço do GitHub Pages sozinho, e a porta que acabou de ser fechada voltaria
# a abrir — sem ninguém perceber, porque nada falharia. Despublicar sem tirar o
# gatilho dura até o próximo merge.
#
# Para voltar ao GitHub Pages um dia: Actions -> "Publicar site" -> Run workflow.
# Ver docs/PUBLICACAO-E-ACESSO.md.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez, sem cancelar a que já está em andamento: derrubar um
# deploy no meio deixaria o site num estado indefinido.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    name: Construir
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # Publicar dado de enchente inválido é o pior desfecho possível deste
      # projeto. O portão de qualidade roda ANTES do build: se os JSONs não
      # passarem, nada vai ao ar e o site no ar continua o de antes.
      - name: Validar os dados antes de publicar
        working-directory: scripts
        run: python3 validar_dados.py

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instalar dependências
        working-directory: web
        run: npm ci

      - name: Testes da lógica
        working-directory: web
        run: npm test

      - name: Build
        working-directory: web
        run: npm run build

      - uses: actions/configure-pages@v6
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  publicar:
    name: Publicar
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
