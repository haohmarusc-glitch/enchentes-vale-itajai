# Baixa do OpenStreetMap o traçado do Rio Luiz Alves, o afluente que o Açu recebe em Ilhota, para
# `achar_confluencias.py` dizer se ele entra antes ou depois da régua de Ilhota (pendência do README).
#
# POR QUE NO ACTIONS. O Overpass não responde ao ambiente das sessões de código; o runner do GitHub alcança.
#
# O QUE FAZ. `baixar_tracado_luiz_alves.py --gravar` pede o rio pelas três grafias do nome, confere que chega ao
# Açu e só então grava. Publica o resumo, o relatório e, se houver, o bruto no branch `tracado-luiz-alves` (um
# commit só, substituído a cada rodada, como o `vao-oeste`), porque a sessão não alcança o servidor dos
# artefatos nem os logs. A sessão converte, mede a confluência e commita no PR.
#
# O QUE NÃO FAZ. Não empurra para o main nem para o branch do PR e não muda o Monitor.
#
# QUANDO RODA. Manualmente ou no push que altera este arquivo ou o script.
name: Baixar o traçado do Rio Luiz Alves

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/baixar-tracado-luiz-alves.yml
      - scripts/baixar_tracado_luiz_alves.py

permissions:
  contents: write   # publicar no branch tracado-luiz-alves

jobs:
  baixar:
    name: Baixar o Luiz Alves
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Instalar dependências
        run: python3 -m pip install -r scripts/requirements.txt
      - name: Baixar e conferir
        # Recusado ou sem resposta, o script sai com 1 ou 2 e não grava; o relatório é publicado assim mesmo.
        run: |
          set +e
          python3 scripts/baixar_tracado_luiz_alves.py --gravar --relatorio rodada.json > resumo.txt 2>&1
          codigo=$?
          cat resumo.txt
          exit $codigo
      - name: Publicar no branch tracado-luiz-alves
        if: always()
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          linhas=$(printf '100644 blob %s\tresumo.txt\n' "$(git hash-object -w resumo.txt)")
          for f in rodada.json data/brutos/tracado-luiz-alves-osm.json; do
            if [ -f "$f" ]; then
              linhas="$linhas"$'\n'"$(printf '100644 blob %s\t%s' "$(git hash-object -w "$f")" "$(basename "$f")")"
            fi
          done
          arvore=$(printf '%s\n' "$linhas" | git mktree)
          commit=$(git commit-tree "$arvore" -m "Traçado do Rio Luiz Alves, a partir de ${GITHUB_SHA::7}")
          git push --force --quiet origin "$commit:refs/heads/tracado-luiz-alves"
          echo "publicado em tracado-luiz-alves: $commit"
