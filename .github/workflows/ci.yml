name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  dados:
    name: Validar dados
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Instalar dependências dos scripts
        run: python3 -m pip install beautifulsoup4 requests ruff -r scripts/requirements-mapas.txt

      # Emprestado do repo Premercado, com a config junto. O conjunto é
      # estreito de propósito: só o que pega código que não faz o que parece
      # fazer. Lint que reprova código correto ensina a ignorar o lint.
      - name: Lint do Python (ruff)
        run: ruff check scripts/
      - name: Validar os JSONs de data/
        working-directory: scripts
        run: python3 validar_dados.py
      # Roda TODO scripts/teste_*.py, e não uma lista escrita à mão.
      # A lista tinha ficado para trás: seis arquivos de teste existiam no
      # repositório e não rodavam aqui, entre eles o que guarda a recusa do KML
      # de Brusque. Um teste que não roda na CI é um teste que não existe no dia
      # em que alguém apontar um importador para o arquivo errado.
      - name: Todos os testes dos scripts
        working-directory: scripts
        run: |
          falhou=""
          for arquivo in teste_*.py; do
            echo "::group::$arquivo"
            python3 "$arquivo" || falhou="$falhou $arquivo"
            echo "::endgroup::"
          done
          if [ -n "$falhou" ]; then
            echo "falharam:$falhou"
            exit 1
          fi
      - name: Sintaxe do publicador de tempo real
        run: bash -n scripts/publicar_tempo_real.sh

  web:
    name: Testes e build do site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Instalar dependências
        working-directory: web
        run: npm ci
      - name: Testes da lógica de previsão e trânsito
        working-directory: web
        run: npm test
      - name: Build (zero erro de tipo)
        working-directory: web
        run: npm run build

      # POR QUE UM NAVEGADOR NA CI. Em 08/09/2026 o build passou, os 494 testes
      # passaram, e o site abriu no celular mostrando só a casca estática do
      # index.html — "Carregando os dados dos rios…". Nada aqui sabia dizer
      # isso: build compila, teste de unidade roda a lógica FORA do navegador.
      # Um import circular ou um asset com caminho errado derrubariam o site
      # inteiro com todas as luzes verdes.
      #
      # O teste roda com a rede externa CORTADA, então não depende do runner
      # alcançar o GitHub — e de quebra prova que a tela sobrevive sem dado ao
      # vivo, que é o que precisa acontecer numa noite de cheia.
      - name: Instalar o Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Fumaça — o site monta num navegador?
        working-directory: web
        run: npm run fumaca

      - name: Regressões da auditoria do navegador
        working-directory: web
        run: npm run auditoria
