name: CI

on:
  push:
    branches: ['**']
  # `labeled`/`unlabeled`: a trava do Monitor lê o rótulo `monitor-autorizado` do evento. Sem estes tipos, o
  # rótulo posto depois de abrir o PR não era visto (a execução da abertura reprovava e "re-run" repete o mesmo
  # evento, ainda sem rótulo), e tirar o rótulo não reprovava o PR.
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

# Um rótulo posto segundos depois de abrir o PR dispara a execução `labeled`, que vê o rótulo e passa — mas a
# execução `opened`, que não o viu, continuava correndo e terminava VERMELHA no mesmo commit (#523 e #526,
# 08/10/2026). Com um grupo por PR e `cancel-in-progress`, a execução nova cancela a anterior: cancelada é
# cinza, não vermelha, e só a última decisão sobre o rótulo conta. Falha real continua aparecendo: a última
# execução reprova se um arquivo do Monitor mudou sem o rótulo, ou se o rótulo foi tirado (`unlabeled`).
# O push de branch fica em grupo próprio (por ref), como antes.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dados:
    name: Validar dados
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Instalar dependências dos scripts
        run: python3 -m pip install beautifulsoup4 requests ruff -r scripts/requirements-mapas.txt

      # Emprestado do repo Premercado, com a config junto. O conjunto é
      # estreito de propósito: só o que pega código que não faz o que parece
      # fazer. Lint que reprova código correto ensina a ignorar o lint.
      - name: Lint do Python (ruff)
        run: ruff check scripts/
      - name: Validar os JSONs de data/
        working-directory: scripts
        run: python3 validar_dados.py
      # Roda TODO scripts/teste_*.py, e não uma lista escrita à mão.
      # A lista tinha ficado para trás: seis arquivos de teste existiam no
      # repositório e não rodavam aqui, entre eles o que guarda a recusa do KML
      # de Brusque. Um teste que não roda na CI é um teste que não existe no dia
      # em que alguém apontar um importador para o arquivo errado.
      - name: Todos os testes dos scripts
        working-directory: scripts
        run: |
          falhou=""
          for arquivo in teste_*.py; do
            echo "::group::$arquivo"
            python3 "$arquivo" || falhou="$falhou $arquivo"
            echo "::endgroup::"
          done
          if [ -n "$falhou" ]; then
            echo "falharam:$falhou"
            exit 1
          fi
      - name: Sintaxe do publicador de tempo real
        run: bash -n scripts/publicar_tempo_real.sh

  web:
    name: Testes e build do site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Instalar dependências
        working-directory: web
        run: npm ci
      - name: Testes da lógica de previsão e trânsito
        working-directory: web
        run: npm test
      - name: Build (zero erro de tipo)
        working-directory: web
        run: npm run build

      # POR QUE UM NAVEGADOR NA CI. Em 08/09/2026 o build passou, os testes
      # passaram, e o site abriu no celular mostrando só a casca estática do
      # index.html — "Carregando os dados dos rios…". Nada aqui sabia dizer
      # isso: build compila, teste de unidade roda a lógica FORA do navegador.
      # Um import circular ou um asset com caminho errado derrubariam o site
      # inteiro com todas as luzes verdes.
      #
      # O teste roda com a rede externa CORTADA, então não depende do runner
      # alcançar o GitHub — e de quebra prova que a tela sobrevive sem dado ao
      # vivo, que é o que precisa acontecer numa noite de cheia.
      - name: Instalar o Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Fumaça — o site monta num navegador?
        working-directory: web
        run: npm run fumaca

      - name: Regressões da auditoria do navegador
        working-directory: web
        run: npm run auditoria

      - name: Simulação de chegada e maré — celular e fusos
        working-directory: web
        run: node testes-navegador/simulacao-chegada.mjs

      # Todas as rotas (descobertas a partir do início) e todos os controles
      # do Monitor e das telas, no celular e no desktop, com a rede cortada.
      - name: Varredura — todas as rotas e controles
        working-directory: web
        run: npm run varredura

      # A versão 2 troca a casca das telas que não são o Monitor (decisão D2,
      # opção ③, de 03/10/2026). O Monitor fica intocado: a trava compara a
      # geometria do mapa com o baseline e reprova barra fixa por cima dele.
      - name: Trava do Monitor — geometria do mapa
        working-directory: web
        run: npm run trava-monitor

      # Modo aplicativo (D5): sem rede o site abre com a cópia guardada, o
      # login do Cloudflare Access nunca é guardado e o interruptor desliga.
      - name: Modo aplicativo — sem rede, login e interruptor
        working-directory: web
        run: npm run pwa

      # Os arquivos do Monitor só mudam com autorização do Jefferson, marcada
      # no PR com o rótulo `monitor-autorizado`.
      - name: Trava do Monitor — arquivos intocados
        if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'monitor-autorizado')
        run: |
          git fetch --depth=1 origin "${{ github.event.pull_request.base.sha }}"
          tocados=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD -- \
            web/src/telas/MonitorBacia.tsx web/src/telas/MonitorBacia.module.css \
            web/src/logica/mapaMotor.ts web/src/logica/mapaCanvas.ts \
            web/src/componentes/CamadasMonitor.tsx web/src/componentes/ChuvaMonitor.tsx \
            web/src/componentes/ArvoreDaBacia.tsx)
          if [ -n "$tocados" ]; then
            echo "Arquivos do Monitor alterados sem o rótulo monitor-autorizado:"
            echo "$tocados"
            exit 1
          fi
