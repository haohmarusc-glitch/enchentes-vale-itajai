name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  dados:
    name: Validar dados
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependências dos scripts
        run: python3 -m pip install beautifulsoup4
      - name: Validar os JSONs de data/
        working-directory: scripts
        run: python3 validar_dados.py
      - name: Testes do analisador da tábua de maré
        working-directory: scripts
        run: python3 teste_coleta_mares.py
      - name: Testes da extração de picos
        working-directory: scripts
        run: python3 teste_extrair_picos.py
      - name: Testes do analisador da página de níveis
        working-directory: scripts
        run: python3 teste_coleta_niveis.py
      - name: Sintaxe do publicador de tempo real
        run: bash -n scripts/publicar_tempo_real.sh

  web:
    name: Testes e build do site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Instalar dependências
        working-directory: web
        run: npm ci
      - name: Testes da lógica de previsão e trânsito
        working-directory: web
        run: npm test
      - name: Build (zero erro de tipo)
        working-directory: web
        run: npm run build
