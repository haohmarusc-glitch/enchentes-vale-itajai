# Procura no OpenStreetMap os dois trechos que faltam no Ribeirão da Murta (Itajaí), entre a DC-07 e a foz
# (vãos de 78 m e 38 m medidos em 08/10/2026, docs/VINCULOS-DOS-TRACADOS.md).
#
# POR QUE NO ACTIONS. O Overpass não responde ao ambiente das sessões de código; o runner do GitHub alcança.
#
# O QUE FAZ. `baixar_vao_murta.py --gravar` pede todo curso d'água em volta dos vãos, encadeia pela conectividade
# e só grava a cadeia que liga as duas pontas de cada vão, terminando nelas. Publica o resumo, o relatório e, se
# houver, o bruto no branch `vao-murta` (um commit só, substituído a cada rodada, como o `vao-oeste`), porque a
# sessão não alcança o servidor dos artefatos nem os logs. A sessão converte, confere e commita no PR.
#
# O QUE NÃO FAZ. Não empurra para o main nem para o branch do PR, não desenha reta, não cria vínculo, não destrava a
# DC-07 e não muda o Monitor.
#
# QUANDO RODA. Manualmente ou no push que altera este arquivo ou o script.
name: Baixar os vãos do Ribeirão da Murta

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/baixar-vao-murta.yml
      - scripts/baixar_vao_murta.py

permissions:
  contents: write   # publicar no branch vao-murta

jobs:
  baixar:
    name: Procurar os vãos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Instalar dependências
        run: python3 -m pip install -r scripts/requirements.txt
      - name: Procurar e conferir
        # Sem cadeia para algum vão, o script sai com 1 (gravando o que fechou): a rodada fica vermelha, mas o
        # relatório é publicado.
        run: |
          set +e
          python3 scripts/baixar_vao_murta.py --gravar --relatorio rodada.json > resumo.txt 2>&1
          codigo=$?
          cat resumo.txt
          exit $codigo
      - name: Publicar no branch vao-murta
        if: always()
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          linhas=$(printf '100644 blob %s\tresumo.txt\n' "$(git hash-object -w resumo.txt)")
          for f in rodada.json data/brutos/vao-murta-osm.json; do
            if [ -f "$f" ]; then
              linhas="$linhas"$'\n'"$(printf '100644 blob %s\t%s' "$(git hash-object -w "$f")" "$(basename "$f")")"
            fi
          done
          arvore=$(printf '%s\n' "$linhas" | git mktree)
          commit=$(git commit-tree "$arvore" -m "Vãos do Ribeirão da Murta, a partir de ${GITHUB_SHA::7}")
          git push --force --quiet origin "$commit:refs/heads/vao-murta"
          echo "publicado em vao-murta: $commit"
