# Captura, só leitura, o mapa de monitoramento da Defesa Civil de Brusque e os dados que ele carrega
# (scripts/capturar_brusque.py). Pedido do Jefferson de 04/11/2026, na cheia: o número oficial de Brusque
# (6,20 m às 19h45) ficou 28 cm acima da DCSC-00019 que o site lê, e a escala publicada (alerta 4,51–7,50 m) não
# está no cadastro. O host recusa as sessões de código; o runner alcança a mesma plataforma em Gaspar.
#
# Publica os brutos e o índice no branch `captura-brusque` (um commit, substituído a cada rodada). Não toca no main
# nem em data/. Roda manualmente ou no push que altera este arquivo ou o script.
name: Capturar o mapa da Defesa Civil de Brusque

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/capturar-brusque.yml
      - scripts/capturar_brusque.py

permissions:
  contents: write   # publicar no branch captura-brusque

jobs:
  capturar:
    name: Captura de Brusque
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Instalar dependências
        run: python3 -m pip install -r scripts/requirements.txt
      # 1ª rodada (04/11/2026, 23h UTC): "Network is unreachable" no robots.txt. Diagnóstico de rede, só leitura:
      # que endereços o nome tem (A/AAAA) e se o robots.txt responde por IPv4 e por IPv6.
      - name: Diagnóstico de rede (DNS, IPv4, IPv6)
        run: |
          set +e
          mkdir -p captura
          {
            echo "== getent ahosts"; getent ahosts defesacivil.brusque.sc.gov.br
            echo "== dig A"; dig +short A defesacivil.brusque.sc.gov.br
            echo "== dig AAAA"; dig +short AAAA defesacivil.brusque.sc.gov.br
            echo "== dig CNAME"; dig +short CNAME defesacivil.brusque.sc.gov.br
            echo "== gaspar (mesma plataforma, alcançável)"; dig +short A defesacivil.gaspar.sc.gov.br
            echo "== robots.txt por IPv4"; curl -4 -sS -m 30 -o /dev/null -w '%{http_code} %{remote_ip}\n' -A 'enchentes-vale-itajai/0.1 (projeto aberto de dados de enchentes; contato via repositorio GitHub)' https://defesacivil.brusque.sc.gov.br/robots.txt
            echo "== robots.txt por IPv6"; curl -6 -sS -m 30 -o /dev/null -w '%{http_code} %{remote_ip}\n' -A 'enchentes-vale-itajai/0.1 (projeto aberto de dados de enchentes; contato via repositorio GitHub)' https://defesacivil.brusque.sc.gov.br/robots.txt
          } > rede.txt 2>&1
          cat rede.txt
      - name: Capturar
        run: |
          set +e
          mkdir -p captura && python3 scripts/capturar_brusque.py --saida captura > captura.txt 2>&1
          cat captura.txt
      - name: Publicar no branch captura-brusque
        if: always()
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          linhas=""
          for f in rede.txt captura.txt captura/*; do
            if [ -f "$f" ]; then
              linhas="$linhas$(printf '100644 blob %s\t%s' "$(git hash-object -w "$f")" "$(basename "$f")")"$'\n'
            fi
          done
          [ -n "$linhas" ] || { echo "nada a publicar"; exit 0; }
          arvore=$(printf '%s' "$linhas" | git mktree)
          commit=$(git commit-tree "$arvore" -m "Captura de Brusque, a partir de ${GITHUB_SHA::7}")
          git push --force --quiet origin "$commit:refs/heads/captura-brusque"
          echo "publicado em captura-brusque: $commit"
