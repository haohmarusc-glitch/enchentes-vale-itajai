# Baixa do OpenStreetMap o traçado do Rio Benedito, do Itajaí do Sul e do Trombudo (pedido do Jefferson,
# 06/10/2026).
#
# POR QUE NO ACTIONS. O Overpass não responde ao ambiente das sessões de código; o runner do GitHub alcança.
#
# O QUE FAZ. `baixar_tracados_afluentes.py --gravar` confere cada rio (chega a um rio desenhado e passa pela
# régua da cidade) e grava só os que passam. Publica os brutos e o resumo da rodada no branch
# `tracado-afluentes` (um commit só, substituído a cada rodada, como o `tracado-hercilio`), porque a sessão
# não alcança o servidor dos artefatos nem os logs. A sessão converte, confere e commita no PR.
#
# O QUE NÃO FAZ. Não empurra para o main nem para o branch do PR, e não muda o Monitor.
#
# QUANDO RODA. Manualmente ou no push que altera este arquivo ou o script.
name: Baixar traçados dos afluentes

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/baixar-tracados-afluentes.yml
      - scripts/baixar_tracados_afluentes.py

permissions:
  contents: write   # publicar no branch tracado-afluentes

jobs:
  baixar:
    name: Baixar Benedito, Itajaí do Sul e Trombudo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Instalar dependências
        run: python3 -m pip install -r scripts/requirements.txt
      - name: Baixar e conferir
        # O resumo vai junto para o branch: é a única forma de a sessão ler o que foi recusado e por quê.
        run: |
          set +e
          python3 scripts/baixar_tracados_afluentes.py --gravar > resumo.txt 2>&1
          codigo=$?
          cat resumo.txt
          exit $codigo
      - name: Publicar no branch tracado-afluentes
        if: always()
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          linhas=$(printf '100644 blob %s\tresumo.txt\n' "$(git hash-object -w resumo.txt)")
          for f in data/brutos/tracado-benedito-osm.json data/brutos/tracado-itajai-do-sul-osm.json data/brutos/tracado-trombudo-osm.json; do
            if [ -f "$f" ]; then
              linhas="$linhas"$'\n'"$(printf '100644 blob %s\t%s' "$(git hash-object -w "$f")" "$(basename "$f")")"
            fi
          done
          arvore=$(printf '%s\n' "$linhas" | git mktree)
          commit=$(git commit-tree "$arvore" -m "Traçados dos afluentes, a partir de ${GITHUB_SHA::7}")
          git push --force --quiet origin "$commit:refs/heads/tracado-afluentes"
          echo "publicado em tracado-afluentes: $commit"
