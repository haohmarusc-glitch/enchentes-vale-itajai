# Captura o CORPO BRUTO das fontes de tempo real das cidades, para conferência.
#
# POR QUE EXISTE. O ambiente das sessões de código recebe 403 do proxy para as
# fontes municipais, e até 27/09/2026 o corpo só chegava salvo à mão. A lógica
# fica em scripts/capturar_fontes.py, com testes: robots.txt antes de cada host,
# User-Agent do projeto, TLS sempre verificado, um pedido por alvo sem insistir.
# Alvos: o portal de Itajaí (municípios 1 a 4), Taió, Rio do Sul (Asthon e
# barragens), Gaspar, Ituporanga, AlertaBlu e o documento de Indaial.
#
# O QUE DEVOLVE. Um artefato com os corpos e o manifesto, e no LOG o resumo por
# alvo e o corpo em gzip+base64 fatiado com o sha256, para uma sessão sem
# acesso ao host remontar com `capturar_fontes.py --remontar`.
#
# O QUE NÃO FAZ. Não muda cadastro, cota nem coletor, e não empurra nada.
#
# QUANDO RODA. Manualmente (workflow_dispatch) ou no push que altera este
# arquivo ou o script — é assim que uma sessão pede uma captura nova antes do
# merge.
name: Capturar fontes das cidades

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/capturar-portal-itajai.yml
      - scripts/capturar_fontes.py

permissions:
  contents: read

jobs:
  capturar:
    name: Baixar as fontes de tempo real
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Instalar dependências
        run: python3 -m pip install -r scripts/requirements.txt
      - name: Capturar
        working-directory: scripts
        run: |
          echo "CARIMBO=$(date -u +%Y-%m-%dT%H%MZ)" >> "$GITHUB_ENV"
          python3 capturar_fontes.py --saida ../captura
      - uses: actions/upload-artifact@v4
        with:
          name: fontes-${{ env.CARIMBO }}
          path: captura/
          retention-days: 30
